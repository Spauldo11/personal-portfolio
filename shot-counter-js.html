<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>Shot Counter</title>
</head>
<body>
    <div class="App">
        <div class="scoreBtns" style="position: relative; z-index: 10;">
            <button class="plusBtn" onclick="upBtn('goal', 'home')">+</button>
            <button class="minusBtn" onclick="downBtn('goal', 'home')">-</button>
            <button class="plusBtn" onclick="upBtn('goal', 'away')">+</button>
            <button class="minusBtn" onclick="downBtn('goal', 'away')">-</button>
        </div>
        
        <div class="scoreboard">
            <div class="home">
                <h1 class="teamName" id="home">HOME - <span id="homeScoreText">0</span></h1>
            </div>
            <div class="away">
                <h1 class="teamName" id="away">AWAY - <span id="awayScoreText">0</span></h1>
            </div>
        </div>
        
        <div class="shot_count">
            <p class="shots" id="homeShotsText">0</p>
            <p class="shots" id="sog">SOG</p>
            <p class="shots" id="awayShotsText">0</p>
        </div>
        
        <div class="fullTimer">
            <button class="playBtn" style="position: relative; z-index: 10;" onclick="toggleTimer()">
                <p class="btnText" id="playPauseBtnText">Play</p>
            </button>
            <div class="time">
                <div class="timer">
                    <h1 class="timeTxt" id="timerText">20:00</h1>
                </div>
                <h2 class="period" id="periodTextLabel">1st</h2>
            </div>
        </div>
        
        <div class="shotBtns" style="position: relative; z-index: 10;">
            <button class="plusBtn" onclick="upBtn('shot', 'home')">+</button>
            <button class="minusBtn" onclick="downBtn('shot', 'home')">-</button>
            <button class="plusBtn" onclick="upBtn('shot', 'away')">+</button>
            <button class="minusBtn" onclick="downBtn('shot', 'away')">-</button>
        </div>
        
        <div class="sideStats">
            <div class="savePct">
                <h1 class="savePctHeader">SAVE %:</h1>
                <h2 class="savePctHome">HOME: <span id="homeSavePctText">N/A</span></h2>
                <h2 class="savePctAway">AWAY: <span id="awaySavePctText">N/A</span></h2>
            </div>
            <div class="chances">
                <h1 class="chancesHeader">CHANCES:</h1>
                <h2 class="chancesHome">HOME: <span id="homeChancesText">0</span></h2>
                <button class="plusBtn" id="homeChancePlus" onclick="updateChance('home', 1)">+</button>
                <button class="minusBtn" id="homeChanceMinus" onclick="updateChance('home', -1)">-</button>
                
                <h2 class="chancesAway">AWAY: <span id="awayChancesText">0</span></h2>
                <button class="plusBtn" id="awayChancePlus" onclick="updateChance('away', 1)">+</button>
                <button class="minusBtn" id="awayChanceMinus" onclick="updateChance('away', -1)">-</button>
            </div>
        </div>
        
        <button class="resetGame" onclick="fullReset()">RESET</button>
        
        <ul class="nav-links">
            <li><a href="projects.html"> Go Back </a></li>
        </ul>
    </div>

    <script>
        // --- STATE VARIABLES ---
        let state = {
            homeScore: 0, homeShots: 0, homeChances: 0,
            awayScore: 0, awayShots: 0, awayChances: 0,
            period: 1,
            periodLength: 20,
            timeLeft: 20 * 60,
            isRunning: false,
            periodText: '1st'
        };
        
        let intervalRef = null;

        // --- CORE FUNCTIONS ---
        function upBtn(type, team) {
            if (team === 'home') {
                if (type === 'goal') state.homeScore++;
                state.homeShots++;
            } else {
                if (type === 'goal') state.awayScore++;
                state.awayShots++;
            }
            updateUI();
        }

        function downBtn(type, team) {
            if (team === 'home') {
                if (type === 'goal' && state.homeScore > 0) state.homeScore--;
                if (state.homeShots > 0) state.homeShots--;
            } else {
                if (type === 'goal' && state.awayScore > 0) state.awayScore--;
                if (state.awayShots > 0) state.awayShots--;
            }
            updateUI();
        }

        function updateChance(team, amount) {
            if (team === 'home') {
                state.homeChances += amount;
                if (state.homeChances < 0) state.homeChances = 0;
            } else {
                state.awayChances += amount;
                if (state.awayChances < 0) state.awayChances = 0;
            }
            updateUI();
        }

        // --- TIMER LOGIC ---
        function toggleTimer() {
            if (state.isRunning) {
                clearInterval(intervalRef);
                intervalRef = null;
                state.isRunning = false;
            } else {
                state.isRunning = true;
                intervalRef = setInterval(() => {
                    state.timeLeft--;
                    
                    if (state.timeLeft <= 0) {
                        clearInterval(intervalRef);
                        intervalRef = null;
                        state.isRunning = false;
                        advancePeriod();
                    }
                    updateUI();
                }, 1000);
            }
            updateUI();
        }

        function advancePeriod() {
            state.period++;
            switch (state.period) {
                case 1: state.periodText = '1st'; break;
                case 2: state.periodText = '2nd'; break;
                case 3: state.periodText = '3rd'; break;
                case 4: 
                    state.periodText = 'OT'; 
                    state.periodLength = 5; 
                    break;
                default: 
                    state.periodText = 'S/O'; 
                    state.periodLength = 0; 
                    break;
            }
            // Reset clock for next period
            state.timeLeft = state.periodLength * 60;
        }

        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function fullReset() {
            clearInterval(intervalRef);
            intervalRef = null;
            state = {
                homeScore: 0, homeShots: 0, homeChances: 0,
                awayScore: 0, awayShots: 0, awayChances: 0,
                period: 1, periodLength: 20,
                timeLeft: 20 * 60,
                isRunning: false,
                periodText: '1st'
            };
            updateUI();
        }

        // --- UI UPDATER ---
        // This function acts like React's render phase. It takes the current state variables
        // and pushes them directly into the inner HTML of the matching elements.
        function updateUI() {
            document.getElementById('homeScoreText').innerText = state.homeScore;
            document.getElementById('awayScoreText').innerText = state.awayScore;
            document.getElementById('homeShotsText').innerText = state.homeShots;
            document.getElementById('awayShotsText').innerText = state.awayShots;
            document.getElementById('homeChancesText').innerText = state.homeChances;
            document.getElementById('awayChancesText').innerText = state.awayChances;

            // Calculate Save Percentages
            let awaySavePct = state.homeShots === 0 ? 'N/A' : Math.round(((state.homeShots - state.homeScore) / state.homeShots) * 1000) / 1000;
            let homeSavePct = state.awayShots === 0 ? 'N/A' : Math.round(((state.awayShots - state.awayScore) / state.awayShots) * 1000) / 1000;

            document.getElementById('homeSavePctText').innerText = homeSavePct;
            document.getElementById('awaySavePctText').innerText = awaySavePct;

            // Update Timer Details
            document.getElementById('timerText').innerText = formatTime(state.timeLeft);
            document.getElementById('periodTextLabel').innerText = state.periodText;
            document.getElementById('playPauseBtnText').innerText = state.isRunning ? 'Pause' : 'Play';
        }

        // Initialize UI on first load
        updateUI();
    </script>
</body>
</html>
